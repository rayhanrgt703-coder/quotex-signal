services:
  - type: web
    name: smart-pro-signal-v4
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OANDA_API_KEY
        sync: false
      - key: ACCOUNT_ID
        sync: false
      - key: OANDA_ENV
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
