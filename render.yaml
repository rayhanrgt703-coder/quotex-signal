services:
  - type: web
    name: smart-pro-signal-oanda
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: OANDA_API_KEY
        sync: false
      - key: OANDA_ENV
        value: practice
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

