services:
  - type: web
    name: oanda-realtime-signal-bot
    env: python
    region: singapore
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: OANDA_TOKEN
        sync: false
      - key: OANDA_ACCOUNT
        sync: false
      - key: TIMEFRAME
        value: "M1"
      - key: MIN_CONFIDENCE
        value: "85"
      - key: INSTRUMENTS
        value: "EUR_USD,GBP_USD,USD_JPY,USD_CAD,AUD_USD,USD_CHF"
